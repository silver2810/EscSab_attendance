<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Registrada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 1.5rem;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .card h3 {
            color: #2e7d32;
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 1rem;
        }
        .card p {
            color: #333333;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }
        .card strong {
            color: #1b5e20;
            font-size: 1.2rem;
            background: #e8f5e9;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>¡Registro Exitoso!</h3>
        <p>Tu código de asistencia es: <strong>{{ attendee_id }}</strong></p>
        <p>Por favor guárdalo para registrar tu asistencia en las reuniones.</p>
    </div>
</body>
</html>
